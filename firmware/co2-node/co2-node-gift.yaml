# Gift/product web-MQTT configuration. The shared setup package
# (co2-node-setup.yaml) owns the WiFi AP, captive portal, QR code, and the
# finish/reset setup buttons; this file only holds the MQTT broker inputs and
# the factory-reset hook that clears them.

esphome:
  on_boot:
    - priority: 190
      then:
        - lambda: |-
            auto *m = id(mqtt_client);
            m->set_broker_address(id(mqtt_broker).state);
            long pv = atol(id(mqtt_port).state.c_str());
            m->set_broker_port((pv > 0 && pv <= 65535) ? (uint16_t) pv : 1883);   // empty/invalid falls back
            m->set_username(id(mqtt_username).state);
            m->set_password(id(mqtt_password).state);
            id(mqtt_optional) = id(mqtt_broker).state.empty();
            if (!id(mqtt_optional)) {
              m->enable();
              id(mqtt_save_deadline) = millis() + 15000;   // -> "failed" if the broker never answers
            }
            id(mqtt_status).publish_state(id(mqtt_optional) ? "not configured" : "connecting");

globals:
  - id: mqtt_save_deadline     # millis() deadline for the "connecting" phase; 0 = none
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: mqtt_was_connected
    type: bool
    restore_value: false
    initial_value: 'false'

text:
  - platform: template
    id: mqtt_broker
    name: "MQTT broker"
    internal: true
    entity_category: config
    optimistic: true
    restore_value: true
    mode: TEXT
    max_length: 64
    initial_value: ""
    web_server:
      sorting_group_id: grp_mqtt
      sorting_weight: 10
    set_action:
      then:
        - lambda: 'id(mqtt_broker).publish_state(x);'
  - platform: template
    id: mqtt_port
    name: "MQTT port"
    internal: true
    entity_category: config
    optimistic: true
    restore_value: true
    mode: TEXT
    pattern: "[0-9]{1,5}"   # hint only; empty/invalid falls back to 1883 in lambdas
    max_length: 5
    initial_value: "1883"
    web_server:
      sorting_group_id: grp_mqtt
      sorting_weight: 20
    set_action:
      then:
        - lambda: 'id(mqtt_port).publish_state(x);'
  - platform: template
    id: mqtt_username
    name: "MQTT username"
    internal: true
    entity_category: config
    optimistic: true
    restore_value: true
    mode: TEXT
    initial_value: ""
    web_server:
      sorting_group_id: grp_mqtt
      sorting_weight: 30
    set_action:
      then:
        - lambda: 'id(mqtt_username).publish_state(x);'
  - platform: template
    id: mqtt_password
    name: "MQTT password"
    internal: true
    entity_category: config
    optimistic: true
    restore_value: true
    mode: TEXT   # not PASSWORD: v3 bundle only constrains input[type=text] to card width, unstyled password overflows
    max_length: 128
    initial_value: ""
    web_server:
      sorting_group_id: grp_mqtt
      sorting_weight: 40
    set_action:
      then:
        - lambda: 'id(mqtt_password).publish_state(x);'

text_sensor:
  - platform: template
    id: mqtt_status
    name: "MQTT status"
    internal: true
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: grp_mqtt
      sorting_weight: 55

button:
  - platform: template
    id: save_mqtt
    name: "Save MQTT settings"
    internal: true
    entity_category: config
    web_server:
      sorting_group_id: grp_mqtt
      sorting_weight: 50
    on_press:
      then:
        - lambda: |-
            auto *m = id(mqtt_client);
            const auto &broker = id(mqtt_broker).state;
            long pv = atol(id(mqtt_port).state.c_str());   // text input: validate range, no uint16_t wrap
            uint16_t port = (pv > 0 && pv <= 65535) ? (uint16_t) pv : 1883;
            m->disable();
            m->set_broker_address(broker);
            m->set_broker_port(port);
            m->set_username(id(mqtt_username).state);
            m->set_password(id(mqtt_password).state);
            id(mqtt_optional) = broker.empty();
            id(mqtt_was_connected) = false;
            if (id(mqtt_optional)) {
              id(mqtt_save_deadline) = 0;
              ESP_LOGI("mqtt_cfg", "no broker configured: MQTT disabled");
            } else {
              id(mqtt_save_deadline) = millis() + 15000;
              m->enable();
              ESP_LOGI("mqtt_cfg", "connecting to %s:%u", broker.c_str(), port);
            }
            if (id(mqtt_port).state != std::to_string(port))   // echo effective port back to the input
              id(mqtt_port).publish_state(std::to_string(port));

script:
  - id: !extend reset_extra
    then:
      - lambda: |-
          id(mqtt_broker).make_call().set_value("").perform();
          id(mqtt_username).make_call().set_value("").perform();
          id(mqtt_password).make_call().set_value("").perform();
          id(mqtt_port).make_call().set_value("1883").perform();

interval:
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return id(setup_mode);'
          then:
            - script.execute: apply_calibration
  - interval: 2s
    then:
      - lambda: |-
          const char *st;
          if (id(mqtt_optional)) {
            st = "not configured";
          } else if (id(mqtt_client).is_connected()) {
            st = "connected";
            id(mqtt_was_connected) = true;
            id(mqtt_save_deadline) = 0;
          } else if (id(mqtt_was_connected)) {
            st = "disconnected";
          } else if (id(mqtt_save_deadline) != 0 && millis() > id(mqtt_save_deadline)) {
            st = "failed";
          } else {
            st = "connecting";
          }
          if (id(mqtt_status).state != st)
            id(mqtt_status).publish_state(st);
