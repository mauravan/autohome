# Dev build: DEBUG logs + checkerboard e-paper test page. Same runtime
# configuration flow as wifi.yaml. Debug alternative without this file:
#   esphome run wifi.yaml -s log_level DEBUG
substitutions:
  log_level: "DEBUG"

esphome:
  name: co2-test
  name_add_mac_suffix: true
  comment: "WiFi dev"

packages:
  core: !include co2-node-core.yaml
  mqtt: !include co2-node-mqtt.yaml

# Checkerboard display page for pixel test; appended via extend.
display:
  - id: !extend epaper_display
    pages:
      - id: page_checker
        lambda: |-
          for (int y = 0; y < it.get_height(); y += 10)
            for (int x = 0; x < it.get_width(); x += 10)
              if (((x + y) / 10) % 2 == 0)
                it.filled_rectangle(x, y, 10, 10);
