# Thin aggregator: transport-neutral base + WiFi/MQTT transport.
# Existing builds (top/mid/bottom/gift/product/test) include THIS file so they
# keep the WiFi+MQTT runtime unchanged. BLE builds include co2-node-base.yaml
# + co2-node-ble*.yaml instead.
packages:
  base: !include co2-node-base.yaml
  wifi: !include co2-node-wifi.yaml
