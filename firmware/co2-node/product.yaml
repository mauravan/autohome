# Per-unit product build. Rendered by production/build_unit.py — do NOT edit
# the identity by hand; edit the template here and rebuild.
substitutions:
  device_name: "co2-sensor-XXXX"
  friendly_name: "CO2 Sensor XXXX"
  floor_label: "CO2 SENSOR"
  mqtt_broker_compile: "homeassistant.local"
  discovery_uid_generator: "mac"
  ap_ssid: "co2-setup-XXXX"
  ap_password_sub: "REPLACE-12CHAR"
  ota_password: !secret ota_password
packages:
  core: !include co2-node-core.yaml
  gift: !include co2-node-gift.yaml
  webui: !include co2-node-webui.yaml
  secure: !include co2-node-secure.yaml
esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: false
  comment: "WiFi"
