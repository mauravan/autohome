# Setup-only WiFi AP + web UI for BLE builds. Runs while `provisioned == false`
# (30-minute window), then WiFi stays off and the node is BLE-only.
# `ap_ssid` / `ap_password_sub` are set per build (>= 8 chars for the password).
wifi:
  id: wifi_component
  enable_on_boot: false
  ap:
    ssid: "${ap_ssid}"
    password: "${ap_password_sub}"
    ap_timeout: 30s

captive_portal:

globals:
  - id: provisioned
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: setup_deadline
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: ap_password
    type: std::string
    restore_value: false
    initial_value: '""'

esphome:
  on_boot:
    - priority: 400
      then:
        - lambda: |-
            id(ap_password) = "${ap_password_sub}";
    - priority: 795   # setup_mode must be decided before ble.yaml's 790 allow_light_sleep
      then:           # assignment: base's 750/100 conditions gate the light-sleep path on
                      # !setup_mode, and with setup_mode still at its initial false there, an
                      # unprovisioned boot would arm the synchronous SCD41 init that those
                      # triggers then skip — a dead sensor in setup mode.
        - lambda: |-
            if (!id(provisioned))
              id(setup_mode) = true;
    - priority: 240
      then:
        - lambda: |-
            if (!id(provisioned)) {
              id(setup_mode) = true;
              id(setup_deadline) = millis() + 1800000UL;   // 30 min
              id(deep_sleep_id).set_run_duration(1800000);
            }
    - priority: 110
      then:
        - if:
            condition:
              lambda: 'return id(setup_mode);'
            then:
              - display.page.show: page_setup
              - delay: 1s
              - lambda: |-
                  id(epaper_display).update();
                  id(epaper_display)->commit_render(0x53455455u, false);
              - wifi.enable:
              - lambda: |-
                  id(link_label) = "WIFI";
                  id(data_label) = "WEB";
                  id(transport_ready) = false;

button:
  - platform: template
    id: finish_setup
    name: "Finish setup (restart)"
    internal: true
    entity_category: config
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 60
    on_press:
      then:
        - lambda: 'id(provisioned) = true;'
        - delay: 1500ms
        - button.press: restart_button
  - platform: template
    id: reset_setup
    name: "Reset to setup"
    internal: true
    entity_category: config
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 70
    on_press:
      then:
        - lambda: |-
            id(co2_offset).make_call().set_value(0).perform();
            id(temp_offset).make_call().set_value(1.0).perform();
            id(hum_offset).make_call().set_value(0).perform();
            id(altitude).make_call().set_value(500).perform();
            id(sleep_interval).make_call().set_value(15).perform();
            id(room_label).make_call().set_value("CO2").perform();
            id(provisioned) = false;
        - delay: 1500ms
        - button.press: restart_button

display:
  - id: !extend epaper_display
    pages:
      - id: page_setup
        lambda: |-
          if (it.get_native_width() > 200) {
            it.print(0, 46, id(font_label_lg), "1 JOIN WIFI");
            it.printf(0, 80, id(font_label_lg), "JOIN %s", "${ap_ssid}");
            it.printf(0, 114, id(font_label_lg), "PASS %s", "${ap_password_sub}");
            it.print(0, 148, id(font_label_lg), "2 OPEN");
            it.print(0, 182, id(font_label_lg), "192.168.4.1");
            it.print(0, 216, id(font_label_lg), "3 SET ROOM/OFFSETS");
            it.print(0, 250, id(font_label_lg), "4 PRESS FINISH");
          } else {
            it.print(0, 32, id(font_label), "1 JOIN WIFI");
            it.printf(0, 56, id(font_label), "JOIN %s", "${ap_ssid}");
            it.printf(0, 80, id(font_label), "PASS %s", "${ap_password_sub}");
            it.print(0, 104, id(font_label), "2 OPEN");
            it.print(0, 128, id(font_label), "192.168.4.1");
            it.print(0, 152, id(font_label), "3 SET ROOM/OFFSETS");
            it.print(0, 176, id(font_label), "4 PRESS FINISH");
          }

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(setup_mode)) {
            id(allow_sleep) = id(setup_deadline) != 0 && millis() > id(setup_deadline);
          }
  - interval: 1s
    then:
      - if:
          condition:
            display.is_displaying_page: page_setup
          then:
            - lambda: |-
                uint32_t sig = 0x53455455u;   // 'SETU'
                auto mix = [&sig](uint32_t v) { sig = (sig ^ v) * 16777619u; };
                for (const char *pp = "${ap_ssid}"; *pp; pp++) mix((uint8_t) *pp);
                if (id(epaper_display)->needs_render(sig)) {
                  ESP_LOGD("screen", "setup render sig=%08x", (unsigned) sig);
                  id(epaper_display).update();
                  id(epaper_display)->commit_render(sig, false);
                }
