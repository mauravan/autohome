substitutions:
  log_level: "NONE"
  ota_password: !secret ota_password

external_components:
  - source:
      type: local
      path: components
    components: [runtime_epaper, scd4x, web_server, captive_portal]

esphome:
  on_boot:
    - priority: 650
      then:
        - lambda: |-
            float a = id(altitude).state;
            if (!isnan(a)) id(scd41_sensor)->set_altitude_compensation((uint16_t) a);
            float m = id(sleep_interval).state;
            if (!isnan(m) && m >= 1.0f && m <= 120.0f)
              id(deep_sleep_id).set_sleep_duration((uint32_t) (m * 60000.0f));
            float n = id(full_refresh_interval).state;
            if (!isnan(n) && n >= 1.0f && n <= 200.0f)
              id(epaper_display)->set_partial_refreshes_before_full((uint16_t) n);
    - priority: 750      # after the power switch is set up (HARDWARE 800), before every I2C client (DATA 600)
      then:
        - lambda: |-
            // On a timer wake the rail was already off for the whole sleep (GPIO20 floats low,
            // external gate pull-down): only a cold boot starts with it driven high by the
            // switch's ALWAYS_ON restore and needs a discharge before re-applying power.
            if (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_UNDEFINED) {
              id(peripheral_power).turn_off();
              delay(300);
            }
            id(peripheral_power).turn_on();
            id(rail_on_ms) = millis();
            // BLE low-power path: stop scd4x's own timeout-based identify chain; base
            // drives it synchronously at priority 100 so the CPU can sleep between steps.
            if (id(allow_light_sleep) && !id(setup_mode)) {
              id(scd41_sensor)->set_skip_setup_identify(true);
            }
            // The settle only matters before the first I2C/SPI traffic. On the light-sleep
            // path a timer wake has none before the priority-100 sync-init, which enforces
            // the POR window from rail_on_ms itself; cold boots keep it because the
            // boot-page render runs before the POR sleep.
            if (!(id(allow_light_sleep) && !id(setup_mode)) ||
                esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_UNDEFINED)
              delay(300);
    - priority: 100
      then:
        - if:
            condition:
              lambda: 'return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_UNDEFINED;'
            then:
              - display.page.show: page_boot
              - lambda: 'id(epaper_display)->force_render();'
              - delay: 1s                  # panel powered at setup; settle before first render
            else:
              - if:
                  condition:
                    lambda: 'return !id(setup_mode);'
                  then:
                    - display.page.show: page_normal   # timer wake: no render, keep persisted sleeping image
                  else:
                    - display.page.show: page_boot     # setup window continuing; sig-guarded, no forced render
        - if:
            condition:
              lambda: 'return id(allow_light_sleep) && !id(setup_mode);'
            then:
              - lambda: |-
                  // BLE low-power path: drive SCD41 identify/config synchronously so the CPU
                  // can light-sleep through the datasheet waits. Mirrors identify_()/configure_():
                  // POR idle window -> stop_periodic_measurement -> 500 ms -> configure.
                  auto light_sleep_ms = [](uint32_t ms) {
                    esp_sleep_enable_timer_wakeup((uint64_t) ms * 1000ULL);
                    // A refused light sleep (held power lock, USB console attached) must not
                    // skip the datasheet wait: SCD41 rejects commands < 500 ms after stop, so
                    // 4 instant retries end at mark_failed() and the wake has no readings —
                    // the "no sensor values" cold boot. Same fallback as the refresh pump in
                    // components/runtime_epaper/runtime_epaper.cpp.
                    if (esp_light_sleep_start() != ESP_OK)
                      delay(ms);
                  };
                  // POR idle window: 1000 ms from rail-on (priority 750), partly elapsed already.
                  uint32_t elapsed = millis() - id(rail_on_ms);
                  if (elapsed < 1050)
                    light_sleep_ms(1050 - elapsed);
                  for (int attempt = 0; attempt < 4 && !id(scd41_sensor)->initialized_; attempt++) {
                    id(scd41_sensor)->status_clear_error();
                    if (id(scd41_sensor)->write_command((uint16_t) 0x3f86)) {  // stop_periodic_measurement (defensive; fresh POR)
                      light_sleep_ms(550);   // datasheet: 500 ms after stop
                      if (id(scd41_sensor)->configure_())
                        break;
                    }
                    light_sleep_ms(1050);    // retry backoff (identify_retry_ uses 1000 ms)
                  }
                  if (!id(scd41_sensor)->initialized_)
                    id(scd41_sensor)->mark_failed();   // mirrors identify_retry_ giving up; update actions become no-ops
            else:
              - wait_until:
                  condition:
                    lambda: 'return id(scd41_sensor)->initialized_;'
                  timeout: 4s
        - lambda: 'id(reading_done) = false;'
        - repeat:
            count: 3
            then:
              - if:
                  condition:
                    lambda: 'return !id(reading_done);'
                  then:
                    - component.update: scd41_sensor
                    - lambda: |-
                        // BLE low-power path: the single shot runs autonomously on the SCD41; light-sleep
                        // the CPU through its 5000 ms window (datasheet max). 5600 ms covers the RTC slow
                        // clock's worst-case skew. esp_timer advances across light sleep, so scd4x's
                        // +5500 ms read timeout fires as soon as the loop resumes after the sleep.
                        if (id(allow_light_sleep) && !id(setup_mode) && id(scd41_sensor)->initialized_) {
                          esp_sleep_enable_timer_wakeup(5600000ULL);
                          esp_light_sleep_start();
                        }
                    - wait_until:
                        condition:
                          lambda: 'return id(reading_done);'
                        timeout: 12s
        - lambda: 'id(boot_readings_done) = true;'
        - if:                       # a reading landed: let its on_value chain dwell, render and sleep
            condition:
              lambda: 'return id(reading_done);'
            then:
              - wait_until:
                  condition:
                    lambda: 'return id(wake_finished);'
                  timeout: 20s
        - if:                       # no reading this wake: still finish the wake (advertise what
            condition:              # we have, close the sleep gate); finish_wake's readiness check
              lambda: 'return !id(wake_finished);'   # keeps the current page on the glass
            then:
              - lambda: 'ESP_LOGW("boot", "no SCD41 reading this wake");'
              - script.execute: finish_wake

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf
  cpu_frequency: 80MHZ

logger:
  level: ${log_level}

safe_mode:

ota:
  - platform: esphome
    password: "${ota_password}"   # production NONE; DEBUG via `-s log_level DEBUG` (logging costs CPU + UART power)

i2c:
  sda: GPIO1
  scl: GPIO21   # was GPIO3; freed GPIO3 (ADC1_CH3) for the battery sense line
  scan: false   # no boot-time bus probe: saves a few transactions + delay
  sda_pullup_enabled: false   # breakout 10k pulls to SCD41 VDD rail; internal pulls would back-power the sensor while the rail is off
  scl_pullup_enabled: false

spi:
  clk_pin: GPIO4
  mosi_pin: GPIO6

