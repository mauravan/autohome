globals:
  - id: allow_sleep
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: allow_light_sleep
    type: bool
    restore_value: false
    initial_value: 'false'   # set true by the BLE transport package (WiFi builds: never)
  - id: rail_on_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: setup_mode
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: boot_readings_done
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: reading_done
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: wake_finished
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_reading_millis
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_updated_ts
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: transport_ready
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: wall_clock_valid
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: wall_clock_epoch
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: frc_busy
    type: bool
    restore_value: false
    initial_value: 'false'

sensor:
  - platform: scd4x
    id: scd41_sensor
    address: 0x62
    update_interval: never
    automatic_self_calibration: true
    altitude_compensation: 500MAMSL
    temperature_offset: 1°C
    measurement_mode: single_shot
    co2:
      id: co2_value
      name: "CO2"
      web_server:
        sorting_group_id: grp_readings
        sorting_weight: 10
      filters:
        - offset: !lambda |-
            float off = id(co2_offset).state;
            return isnan(off) ? 0.0f : off;
    temperature:
      id: temperature_value
      name: "Temperature"
      web_server:
        sorting_group_id: grp_readings
        sorting_weight: 20
      filters:
        - offset: !lambda |-
            float off = id(temp_offset).state;
            return isnan(off) ? 0.0f : off;
    humidity:
      id: humidity_value
      name: "Humidity"
      web_server:
        sorting_group_id: grp_readings
        sorting_weight: 30
      filters:
        - offset: !lambda |-
            float off = id(hum_offset).state;
            return isnan(off) ? 0.0f : off;
      on_value:
        then:
          - lambda: |-
              id(reading_done) = true;
              id(last_reading_millis) = millis();   // anchor for "last updated" wall-time back-computation
          - lambda: |-
              ESP_LOGI("publish", "readings co2=%.0f ppm temp=%.2f C hum=%.2f %%", id(co2_value).state, id(temperature_value).state, x);
          - lambda: |-
              // SCD41 -> power_down (0x36e0); the next wake power-cycles the rail (on_boot priority 750).
              id(scd41_sensor)->write_command((uint16_t) 0x36e0);
          - script.execute: finish_wake
  - platform: adc
    id: battery_voltage
    pin: GPIO3
    attenuation: 12db
    update_interval: never
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 25
    filters:
      - multiply: 2.0   # battery-management board presents VBAT/2; scale back to cell volts
      - sliding_window_moving_average:
          window_size: 3
          send_every: 3
          send_first_at: 3
    on_value:
      then:
        - lambda: |-
            // Li-ion OCV -> SoC, piecewise-linear (resting cell voltage). The anchors come from the
            // standard Li-ion OCV table (3.00 V = 0 % ... 4.20 V = 100 %) rescaled to this cell's
            // usable range: 3.60 V = empty (cutoff), 4.00 V = full (charge target). 3.8 V ~ 7 %.
            static const float V_TBL[] = {3.6000f, 3.7833f, 3.8267f, 3.8467f, 3.8567f, 3.8633f, 3.8733f, 3.8900f, 3.9067f, 3.9267f, 3.9533f, 4.0000f};
            static const float P_TBL[] = {0.0f,  5.0f, 10.0f, 20.0f, 30.0f, 40.0f, 50.0f, 60.0f, 70.0f, 80.0f, 90.0f, 100.0f};
            const int N = (int) (sizeof(V_TBL) / sizeof(V_TBL[0]));
            float v = x;
            if (isnan(v) || v < 2.0f) {
              // A failed ADC read aggregates to 0 V; publishing that as 0 % would report
              // a charged cell as empty. Keep the previous level instead.
              ESP_LOGW("battery", "implausible cell %.3f V; battery level not updated", v);
              return;
            }
            float pct = 0.0f;
            if (v <= V_TBL[0]) {
              pct = 0.0f;
            } else if (v >= V_TBL[N - 1]) {
              pct = 100.0f;
            } else {
              for (int i = 0; i < N - 1; i++) {
                if (v >= V_TBL[i] && v <= V_TBL[i + 1]) {
                  float t = (v - V_TBL[i]) / (V_TBL[i + 1] - V_TBL[i]);
                  pct = P_TBL[i] + t * (P_TBL[i + 1] - P_TBL[i]);
                  break;
                }
              }
            }
            id(battery_percent).publish_state(pct);
            ESP_LOGI("battery", "cell %.3f V -> %.1f %%", v, pct);
  - platform: template
    id: battery_percent
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 20

number:
  - platform: template
    id: co2_offset
    name: "ppm · CO2 offset"
    internal: true
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: -2000
    max_value: 2000
    step: 1
    initial_value: 0
    unit_of_measurement: " "   # blank, not empty: v3 UI prints "undefined" when uom is absent; unit moved into name
    mode: slider
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 10
    set_action:
      then:
        - lambda: 'id(co2_offset).publish_state(x);'
        - script.execute: apply_calibration
  - platform: template
    id: temp_offset
    name: "°C · Temperature offset"
    internal: true
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: -10
    max_value: 10
    step: 0.1
    initial_value: 0
    unit_of_measurement: " "   # blank, not empty: v3 UI prints "undefined" when uom is absent; unit moved into name
    mode: slider
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 20
    set_action:
      then:
        - lambda: 'id(temp_offset).publish_state(x);'
        - script.execute: apply_calibration
  - platform: template
    id: hum_offset
    name: "% · Humidity offset"
    internal: true
    entity_category: config
    restore_value: true
    min_value: -20
    max_value: 20
    step: 0.5
    initial_value: 0
    unit_of_measurement: " "   # blank, not empty: v3 UI prints "undefined" when uom is absent; unit moved into name
    mode: slider
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 30
    set_action:
      then:
        - lambda: 'id(hum_offset).publish_state(x);'
        - script.execute: apply_calibration
  - platform: template
    id: altitude
    name: "m · Altitude"
    internal: true
    entity_category: config
    restore_value: true
    min_value: 0
    max_value: 3000
    step: 10
    initial_value: 500
    unit_of_measurement: " "   # blank, not empty: v3 UI prints "undefined" when uom is absent; unit moved into name
    mode: slider
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 40
    set_action:
      then:
        - lambda: 'id(altitude).publish_state(x);'
        - script.execute: apply_calibration
  - platform: template
    id: frc_reference
    name: "ppm · FRC reference"
    internal: true
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 400
    max_value: 2000
    step: 10
    initial_value: 420
    unit_of_measurement: " "
    mode: box
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 50
    set_action:
      then:
        - lambda: 'id(frc_reference).publish_state(x);'
  - platform: template
    id: sleep_interval
    name: "min · Sleep interval"
    internal: true
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 15
    unit_of_measurement: " "   # blank, not empty: v3 UI prints "undefined" when uom is absent; unit moved into name
    mode: box
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 35
    set_action:
      then:
        - lambda: |-
            float m = x < 1.0f ? 1.0f : (x > 120.0f ? 120.0f : x);
            id(deep_sleep_id).set_sleep_duration((uint32_t) (m * 60000.0f));
  - platform: template
    id: full_refresh_interval
    name: "# · Full refresh every"
    internal: true
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 200
    step: 1
    initial_value: 24
    unit_of_measurement: " "   # blank, not empty: v3 UI prints "undefined" when uom is absent; unit moved into name
    mode: box
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 40
    set_action:
      then:
        - lambda: |-
            float n = x < 1.0f ? 1.0f : (x > 200.0f ? 200.0f : x);
            id(epaper_display)->set_partial_refreshes_before_full((uint16_t) n);

script:
  - id: transport_publish
    mode: single
    then: []

  - id: apply_calibration
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: 'return id(boot_readings_done);'
          timeout: 60s
      - delay: 1s
      - lambda: 'id(scd41_sensor)->write_command((uint16_t) 0x36f6);'
      - delay: 1s
      - lambda: |-
          float a = id(altitude).state;
          if (!isnan(a)) {
            id(scd41_sensor)->set_altitude_compensation((uint16_t) a);
            id(scd41_sensor)->write_command((uint16_t) 0x2427, (uint16_t) a);
          }
      - component.update: scd41_sensor
      - delay: 6s
  - id: perform_frc
    mode: single
    then:
      - if:
          condition: { lambda: 'return id(scd41_sensor)->initialized_;' }
          then:
            - lambda: 'id(frc_busy) = true;'
            - wait_until:
                condition:
                  lambda: 'return id(boot_readings_done);'
                timeout: 60s
            - delay: 1s
            - lambda: 'id(scd41_sensor)->write_command((uint16_t) 0x36f6);'
            - delay: 1s
            - lambda: 'id(scd41_sensor)->write_command((uint16_t) 0x219d);'
            - delay: 6s
            - lambda: |-
                float r = id(frc_reference).state;
                uint16_t ref = (uint16_t) (isnan(r) ? 420.0f : (r < 400.0f ? 400.0f : (r > 2000.0f ? 2000.0f : r)));
                id(scd41_sensor)->write_command((uint16_t) 0x362f, ref);
            - delay: 400ms
            - lambda: 'id(scd41_sensor)->write_command((uint16_t) 0x3615);'
            - delay: 400ms
            - lambda: |-
                id(epaper_display)->clear_prev_co2();
                id(frc_busy) = false;
                ESP_LOGI("frc", "forced calibration to %u ppm applied and persisted", (unsigned) ((uint16_t) id(frc_reference).state));
          else:
            - lambda: 'ESP_LOGW("frc", "SCD41 not initialized; calibration skipped");'
  - id: render_normal_page
    mode: single
    then:
      - lambda: |-
          // A wake without a reading must not overwrite a good image with placeholders: keep the
          // last rendered values (their footer timestamp stays at that older reading).
          if (!id(reading_done) && id(epaper_display)->panel_has_values()) {
            ESP_LOGW("screen", "no reading this wake; keeping the last rendered values");
            return;
          }
          // "Last updated" wall time. With a reading this wake: reading time, back-computed
          // from the transport wall clock (SNTP on WiFi builds; invalid on BLE-only builds).
          // Without a reading: wake/boot time. No valid clock: 0 -> placeholder.
          id(last_updated_ts) = 0;
          if (id(wall_clock_valid)) {
            uint32_t now_ep = id(wall_clock_epoch);
            uint32_t since = id(reading_done)
                                 ? ((millis() - id(last_reading_millis)) / 1000u)
                                 : (millis() / 1000u);
            id(last_updated_ts) = now_ep > since ? now_ep - since : now_ep;
          }
          // Trend vs the wake whose values last hit the glass. Deadband ±25 ppm matches
          // the CO2 signature bucket, so noise alone cannot flip the arrow.
          uint16_t prev = 0;
          const bool has_prev = id(epaper_display)->get_prev_co2(prev);
          const bool co2_ok = !isnan(id(co2_value).state) && id(co2_value).state < 1000.0f;
          const bool hum_ok = !isnan(id(humidity_value).state) && id(humidity_value).state > 30.0f &&
                              id(humidity_value).state < 60.0f;
          int trend = -2;   // -2 none (no prev / no reading), -1 down, 0 flat, +1 up
          if (has_prev && !isnan(id(co2_value).state)) {
            float d = id(co2_value).state - (float) prev;
            trend = (d >= 25.0f) ? 1 : ((d <= -25.0f) ? -1 : 0);
          }
          uint32_t sig = 2166136261u;   // FNV-1a
          auto mix = [&sig](uint32_t v) { sig = (sig ^ v) * 16777619u; };
          auto q = [](float v, float bucket) -> uint32_t {
            if (isnan(v)) return 0xFFFFFFFFu;
            float s = v / bucket;
            return (uint32_t) ((int32_t) (s >= 0 ? s + 0.5f : s - 0.5f) + 100000);
          };
          mix(q(id(co2_value).state, 25.0f));
          mix(q(id(temperature_value).state, 0.5f));
          mix(q(id(humidity_value).state, 2.0f));
          mix(q(id(battery_percent).state, 2.0f));
          mix(((uint32_t) id(epaper_display)->get_native_width() << 16) |
              (uint32_t) id(epaper_display)->get_native_height());
          if (id(epaper_display)->get_native_width() > 200) {
            if (id(last_updated_ts) != 0) {
              auto rt = ESPTime::from_epoch_local((time_t) id(last_updated_ts));
              mix((uint32_t) rt.day_of_month << 24 | (uint32_t) rt.month << 16 |
                  (uint32_t) rt.hour << 8 | (uint32_t) rt.minute);
            } else {
              mix(0xFFFFFFFFu);
            }
            mix(q(id(sleep_interval).state, 1.0f));
          }
          for (char c : id(room_label).state)
            mix((uint8_t) c);
          mix((uint32_t) (trend + 2));
          mix(co2_ok ? 1u : 0u);
          mix(hum_ok ? 1u : 0u);
          // A values-less glass (boot page, or a panel this firmware never committed) must be
          // repainted with the full waveform: the partial waveform cannot flip a mostly-changed
          // image, it only darkens it, and every later partial builds on that state.
          const bool need_full = !id(epaper_display)->panel_has_values();
          if (id(epaper_display)->needs_render(sig) || need_full) {
            ESP_LOGD("screen", "render sig=%08x full=%d", (unsigned) sig, (int) need_full);
            if (need_full)
              id(epaper_display)->request_full_refresh();
            id(epaper_display).update();
            id(epaper_display)->commit_render(sig, id(reading_done));
          } else {
            ESP_LOGV("screen", "skip unchanged sig=%08x", (unsigned) sig);
          }
          if (id(reading_done) && !isnan(id(co2_value).state))
            id(epaper_display)->set_prev_co2((uint16_t) id(co2_value).state);   // CO2 fits uint16 (0–40000 ppm)
  - id: finish_wake
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(wake_finished);'
          then:
            - lambda: 'id(wake_finished) = true;'
            - delay: 500ms
            - lambda: |-
                // Sample the cell at the wake's quietest moment: the SCD41 is already
                // powered down (0x36e0 in the humidity on_value), no e-paper refresh is
                // in flight (the render comes later), and the radio is idle — BLE builds
                // enable the controller only inside transport_publish below, WiFi builds
                // are past the reading-publish TX burst (500 ms settle) and doze between
                // beacons. The old position sampled mid-load right after the reading and
                // read the sagging cell, reporting a charged battery as 4-7 %. One
                // 3-sample window -> one averaged publish through the on_value guard; it
                // feeds the normal-page render below, MQTT (state publishes immediately
                // on publish_state, broker already connected), and the BTHome payload
                // (whose adv snapshot is taken inside transport_publish below).
                for (int i = 0; i < 3; i++) {
                  if (id(battery_voltage)->is_ready())
                    id(battery_voltage)->update();
                  delay(100);
                }
            - script.execute: transport_publish
            - if:
                condition:
                  lambda: 'return !id(setup_mode);'
                then:
                  - if:
                      condition:
                        and:
                          - lambda: 'return id(reading_done);'
                          - lambda: 'return !isnan(id(battery_percent).state);'
                      then:
                        - wait_until:
                            condition:
                              lambda: 'return id(allow_sleep);'
                            timeout: 150s   # cold boot: transport bound (60 s) + 60 s config window + margin
                        - display.page.show: page_normal
                        - script.execute: render_normal_page
                      else:
                        - lambda: |-
                            // Never switch to the main screen before what it shows exists: a
                            // values-less render (SCD41 failed this wake) or an unpublished
                            // battery level would sit on the glass for the whole sleep cycle.
                            // Stay on the boot page (cold boot) / keep the last good image
                            // (timer wake); the next wake retries.
                            ESP_LOGW("wake", "main screen not ready (reading=%d battery=%s); keeping the current page",
                                     (int) id(reading_done),
                                     isnan(id(battery_percent).state) ? "unset" : "set");
            - wait_until:
                condition:
                  lambda: 'return id(allow_sleep) || id(setup_mode);'
                timeout: 70s
            - if:
                condition:
                  lambda: 'return id(allow_sleep);'
                then:
                  - switch.turn_off: peripheral_power
                  - deep_sleep.enter: deep_sleep_id
                else:
                  - lambda: |-
                      ESP_LOGW("wake", "not sleeping: gate closed (transport_ready=%d)",
                               id(transport_ready));

text:
  - platform: template
    id: room_label
    name: "Room label"
    internal: true
    entity_category: config
    optimistic: true
    restore_value: true
    mode: TEXT
    max_length: 16
    initial_value: ""
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 10
    set_action:
      then:
        - lambda: 'id(room_label).publish_state(x);'

button:
  - platform: restart
    id: restart_button
    name: "Restart"
    internal: true
    web_server:
      sorting_group_id: grp_actions
      sorting_weight: 30
  - platform: template
    id: calibrate_co2_button
    name: "Calibrate CO2 (FRC)"
    internal: true
    entity_category: config
    web_server:
      sorting_group_id: grp_actions
      sorting_weight: 40
    on_press:
      then:
        - script.execute: perform_frc

switch:
  - platform: gpio
    id: peripheral_power
    name: "Peripheral Power"
    pin: GPIO20
    restore_mode: ALWAYS_ON   # HIGH at setup (HARDWARE 800) -> SCD41 + EPD rail up before display init (PROCESSOR 400)
    internal: true            # firmware-managed power gate, not an HA entity
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 80
  - platform: template
    id: panel_42
    name: "4.2 inch panel"
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 70
    turn_on_action:
      - lambda: 'id(epaper_display)->set_panel_requested(true);'
    turn_off_action:
      - lambda: 'id(epaper_display)->set_panel_requested(false);'

display:
  - platform: runtime_epaper
    id: epaper_display
    cs_pin: GPIO7
    dc_pin: GPIO5
    reset_pin: GPIO0
    busy_pin: GPIO10
    update_interval: never
    pages:
      - id: page_boot
        lambda: |-
          const bool sta = id(wifi_component).is_connected();
          char ip_buf[40]; ip_buf[0] = 0;
          if (sta) {
            auto ips = id(wifi_component).wifi_sta_ip_addresses();
            if (!ips.empty()) ips[0].str_to(ip_buf);
          }
          if (it.get_native_width() > 200) {
            const int w = it.get_width();
            const int h = it.get_height();
            if (sta && ip_buf[0] != 0) {
              // connected: QR opens the web UI at this address, URL + instruction below
              id(url_qr_code).set_value(std::string("http://") + ip_buf);   // regenerates on next get_size()/draw
              const int qr_mods = id(url_qr_code).get_size();
              const int reserve = 70;                          // URL line (24 px) + instruction line (16 px)
              const int side = (h - reserve < w) ? h - reserve : w;
              const int qr_scale = side / qr_mods;
              const int qr_px = qr_mods * qr_scale;
              it.qr_code((w - qr_px) / 2, (h - reserve - qr_px) / 2, id(url_qr_code), COLOR_ON, qr_scale);
              char url_buf[48];
              snprintf(url_buf, sizeof(url_buf), "http://%s", ip_buf);
              it.print(w / 2, h - 62, id(font_label_lg), TextAlign::TOP_CENTER, url_buf);
              it.print(w / 2, h - 8, id(font_label), TextAlign::BOTTOM_CENTER, "open in your browser for configuration");
            } else if (id(wifi_component).is_ap_active()) {
              // no station: QR to join the setup AP, AP IP below
              const int qr_mods = id(ap_qr_code).get_size();   // generates once, then cached
              const int reserve = 44;                          // bottom strip for the AP IP
              const int side = (h - reserve < w) ? h - reserve : w;
              const int qr_scale = side / qr_mods;
              const int qr_px = qr_mods * qr_scale;
              it.qr_code((w - qr_px) / 2, (h - reserve - qr_px) / 2, id(ap_qr_code), COLOR_ON, qr_scale);
              char ap_buf[40];
              id(wifi_component).wifi_soft_ap_ip().str_to(ap_buf);
              it.print(w / 2, h - 8, id(font_label_lg), TextAlign::BOTTOM_CENTER, ap_buf);
            } else {
              // connecting, nothing to show yet
              it.print(w / 2, h / 2, id(font_cog_lg), TextAlign::CENTER, "\ue8b8");
            }
          } else {
            const int w = it.get_width();
            const int h = it.get_height();
            if (sta && ip_buf[0] != 0) {
              id(url_qr_code).set_value(std::string("http://") + ip_buf);
              const int qr_mods = id(url_qr_code).get_size();
              const int reserve = 70;                          // three 16 px text lines
              const int side = (h - reserve < w) ? h - reserve : w;
              const int qr_scale = side / qr_mods;
              const int qr_px = qr_mods * qr_scale;
              it.qr_code((w - qr_px) / 2, (h - reserve - qr_px) / 2, id(url_qr_code), COLOR_ON, qr_scale);
              char url_buf[48];
              snprintf(url_buf, sizeof(url_buf), "http://%s", ip_buf);
              it.print(w / 2, h - 64, id(font_label), TextAlign::TOP_CENTER, url_buf);
              it.print(w / 2, h - 44, id(font_label), TextAlign::TOP_CENTER, "open in your browser");
              it.print(w / 2, h - 2, id(font_label), TextAlign::BOTTOM_CENTER, "for configuration");
            } else if (id(wifi_component).is_ap_active()) {
              const int qr_mods = id(ap_qr_code).get_size();
              const int reserve = 24;
              const int side = (h - reserve < w) ? h - reserve : w;
              const int qr_scale = side / qr_mods;
              const int qr_px = qr_mods * qr_scale;
              it.qr_code((w - qr_px) / 2, (h - reserve - qr_px) / 2, id(ap_qr_code), COLOR_ON, qr_scale);
              char ap_buf[40];
              id(wifi_component).wifi_soft_ap_ip().str_to(ap_buf);
              it.print(w / 2, h - 4, id(font_label), TextAlign::BOTTOM_CENTER, ap_buf);
            } else {
              it.print(w / 2, h / 2, id(font_cog_lg), TextAlign::CENTER, "\ue8b8");
            }
          }
      - id: page_normal
        lambda: |-
          ESP_LOGI("screen", "screen co2=%.0f ppm temp=%.2f C hum=%.2f %%", id(co2_value).state, id(temperature_value).state, id(humidity_value).state);
          uint16_t prev_ppm = 0;
          const bool has_prev = id(epaper_display)->get_prev_co2(prev_ppm);
          const bool co2_ok = !isnan(id(co2_value).state) && id(co2_value).state < 1000.0f;
          const bool hum_ok = !isnan(id(humidity_value).state) && id(humidity_value).state > 30.0f &&
                              id(humidity_value).state < 60.0f;
          int trend = -2;
          if (has_prev && !isnan(id(co2_value).state)) {
            float d = id(co2_value).state - (float) prev_ppm;
            trend = (d >= 25.0f) ? 1 : ((d <= -25.0f) ? -1 : 0);
          }
          const char *trend_glyph = (trend == 1) ? "\ue8e5" : (trend == -1) ? "\ue8e3" : (trend == 0) ? "\ue8e4" : nullptr;
          if (it.get_native_width() > 200) {
            int w = it.get_width();
            int h = it.get_height();
            it.printf(0, 0, id(font_label_lg), "%s", id(room_label).state.c_str());
            {
              float bp = id(battery_percent).state;
              it.print(w, 2, id(font_status_lg), TextAlign::TOP_RIGHT, (isnan(bp) || bp > 65.0f) ? "\ue1a4" : (bp >= 35.0f ? "\uebdd" : "\ue19c"));
              if (isnan(bp)) {
                it.print(w - 30, 2, id(font_label_lg), TextAlign::TOP_RIGHT, "-- %");
              } else {
                it.printf(w - 30, 2, id(font_label_lg), TextAlign::TOP_RIGHT, "%.0f %%", bp);
              }
            }
            it.line(0, 32, w, 32);
            const int footer_h = 30;
            const float rh = (h - 32 - footer_h) / 3.0f;
            int c0 = 32 + (int)(rh * 0.5f);
            int c1 = 32 + (int)(rh * 1.5f);
            int c2 = 32 + (int)(rh * 2.5f);
            int l1 = 32 + (int)rh;
            int l2 = 32 + (int)(rh * 2.0f);
            const int fy = h - footer_h;
            it.print(0, c0, id(font_icons_lg), TextAlign::CENTER_LEFT, "\ue7b0");
            if (!isnan(id(co2_value).state))
              it.print(44, c0, id(font_icons_lg), TextAlign::CENTER_LEFT, co2_ok ? "\ue813" : "\ue811");
            if (trend_glyph != nullptr)
              it.print(92, c0, id(font_status_lg), TextAlign::CENTER_LEFT, trend_glyph);
            if (isnan(id(co2_value).state)) {
              it.print(w, c0, id(font_value_lg), TextAlign::CENTER_RIGHT, "--");
            } else {
              it.printf(w, c0, id(font_value_lg), TextAlign::CENTER_RIGHT, "%.0f", id(co2_value).state);
            }
            it.line(0, l1, w, l1);
            it.print(0, c1, id(font_icons_lg), TextAlign::CENTER_LEFT, "\ue1ff");
            if (isnan(id(temperature_value).state)) {
              it.print(w, c1, id(font_value_lg), TextAlign::CENTER_RIGHT, "-- C");
            } else {
              it.printf(w, c1, id(font_value_lg), TextAlign::CENTER_RIGHT, "%.1f C", id(temperature_value).state);
            }
            it.line(0, l2, w, l2);
            it.print(0, c2, id(font_icons_lg), TextAlign::CENTER_LEFT, "\ue798");
            if (!isnan(id(humidity_value).state))
              it.print(44, c2, id(font_icons_lg), TextAlign::CENTER_LEFT, hum_ok ? "\ue813" : "\ue811");
            if (isnan(id(humidity_value).state)) {
              it.print(w, c2, id(font_value_lg), TextAlign::CENTER_RIGHT, "-- %%");
            } else {
              it.printf(w, c2, id(font_value_lg), TextAlign::CENTER_RIGHT, "%.0f %%", id(humidity_value).state);
            }
            it.line(0, fy, w, fy);
            const int fmid = fy + footer_h / 2;
            #ifdef USE_TIME
            it.print(0, fmid, id(font_icons_footer), TextAlign::CENTER_LEFT, "\ue8b5");
            if (id(last_updated_ts) != 0) {
              auto rt = ESPTime::from_epoch_local((time_t) id(last_updated_ts));
              it.printf(36, fmid, id(font_label_lg), TextAlign::CENTER_LEFT,
                        "%02d.%02d. %02d:%02d", rt.day_of_month, rt.month, rt.hour, rt.minute);
            } else {
              it.print(36, fmid, id(font_label_lg), TextAlign::CENTER_LEFT, "--.-- --:--");
            }
            #endif
            if (!isnan(id(sleep_interval).state)) {
              it.printf(w - 38, fmid, id(font_label_lg), TextAlign::CENTER_RIGHT, "%.0f min", id(sleep_interval).state);
            } else {
              it.print(w - 38, fmid, id(font_label_lg), TextAlign::CENTER_RIGHT, "-- min");
            }
            it.print(w, fmid, id(font_icons_footer), TextAlign::CENTER_RIGHT, "\ue425");
          } else {
            it.printf(0, 0, id(font_label), "%s", id(room_label).state.c_str());
            {
              float bp = id(battery_percent).state;
              it.print(200, 8, id(font_status), TextAlign::CENTER_RIGHT, (isnan(bp) || bp > 65.0f) ? "\ue1a4" : (bp >= 35.0f ? "\uebdd" : "\ue19c"));
              if (isnan(bp)) {
                it.print(176, 8, id(font_label), TextAlign::CENTER_RIGHT, "-- %");
              } else {
                it.printf(176, 8, id(font_label), TextAlign::CENTER_RIGHT, "%.0f %%", bp);
              }
            }
            it.line(0, 20, 200, 20);
            it.print(0, 50, id(font_icons), TextAlign::CENTER_LEFT, "\ue7b0");  // co2
            if (!isnan(id(co2_value).state))
              it.print(34, 50, id(font_icons), TextAlign::CENTER_LEFT, co2_ok ? "\ue813" : "\ue811");
            if (trend_glyph != nullptr)
              it.print(68, 50, id(font_status), TextAlign::CENTER_LEFT, trend_glyph);
            if (isnan(id(co2_value).state)) {
              it.print(200, 50, id(font_co2), TextAlign::CENTER_RIGHT, "--");
            } else {
              it.printf(200, 50, id(font_co2), TextAlign::CENTER_RIGHT, "%.0f", id(co2_value).state);
            }
            it.line(0, 80, 200, 80);
            it.print(0, 110, id(font_icons), TextAlign::CENTER_LEFT, "\ue1ff");  // thermometer
            if (isnan(id(temperature_value).state)) {
              it.print(200, 110, id(font_temp), TextAlign::CENTER_RIGHT, "-- C");
            } else {
              it.printf(200, 110, id(font_temp), TextAlign::CENTER_RIGHT, "%.1f C", id(temperature_value).state);
            }
            it.line(0, 140, 200, 140);
            it.print(0, 170, id(font_icons), TextAlign::CENTER_LEFT, "\ue798");  // water drop
            if (!isnan(id(humidity_value).state))
              it.print(34, 170, id(font_icons), TextAlign::CENTER_LEFT, hum_ok ? "\ue813" : "\ue811");
            if (isnan(id(humidity_value).state)) {
              it.print(200, 170, id(font_humid), TextAlign::CENTER_RIGHT, "-- %%");
            } else {
              it.printf(200, 170, id(font_humid), TextAlign::CENTER_RIGHT, "%.0f %%", id(humidity_value).state);
            }
          }

deep_sleep:
  id: deep_sleep_id
  sleep_duration: 1min
  run_duration: 120s   # normal cap: measurement + render ≈ 35 s; setup overlay raises to 30 min while unprovisioned

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(setup_mode)) return;   // the setup package owns allow_sleep in setup mode
          if (id(boot_ready_ms) == 0 &&
              ((id(reading_done) && id(transport_ready)) || millis() > 60000UL))
            id(boot_ready_ms) = millis();   // all-components-ready anchor; 60 s bound = dead transport still counts
          const bool window_hold = id(cold_boot) &&
              (id(boot_ready_ms) == 0 || (millis() - id(boot_ready_ms)) < 60000UL);
          id(allow_sleep) = id(transport_ready) && !window_hold && !id(frc_busy);
  - interval: 500ms
    then:
      - lambda: |-
          if (id(epaper_display)->is_panel_change_pending())
            id(epaper_display)->apply_panel_change();
  - interval: 1s
    then:
      - if:
          condition:
            display.is_displaying_page: page_boot
          then:
            - lambda: |-
                uint32_t sig = 0x424F4F54u;   // 'BOOT'
                auto mix = [&sig](uint32_t v) { sig = (sig ^ v) * 16777619u; };
                const bool sta = id(wifi_component).is_connected();
                mix((uint32_t) sta);
                mix((uint32_t) id(wifi_component).is_ap_active());
                if (sta) {
                  auto ips = id(wifi_component).wifi_sta_ip_addresses();
                  if (!ips.empty()) { char b[40]; ips[0].str_to(b); for (const char *p = b; *p; p++) mix((uint8_t) *p); }
                }
                if (id(epaper_display)->needs_render(sig)) {
                  ESP_LOGD("screen", "boot render sig=%08x", (unsigned) sig);
                  id(epaper_display).update();
                  id(epaper_display)->commit_render(sig, false);
                }
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(wake_finished) && id(reading_done) && !id(setup_mode);'
              - lambda: 'return !isnan(id(battery_percent).state);'
              - display.is_displaying_page: page_normal
          then:
            - script.execute: render_normal_page
