esphome:
  on_boot:
    - priority: 600
      then:
        - switch.turn_on: peripheral_power   # rail up first (ALWAYS_ON already did at setup); settle for SCD41 POR + EPD reset
        - delay: 1s
        - repeat:
            count: 3
            then:
              - component.update: battery_voltage   # 3 ADC reads, averaged via sliding_window_moving_average (window 3)
              - delay: 100ms
    - priority: 100
      then:
        - if:
            condition:
              lambda: 'return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_UNDEFINED;'
            then:
              - display.page.show: page_boot
              - delay: 1s                  # panel powered at setup; settle before first render
              - component.update: epaper_display   # boot page v1: cold start only
            else:
              - display.page.show: page_normal   # timer wake: no render, keep persisted sleeping image
        - lambda: |-
            id(scd41_sensor)->write_command((uint16_t) 0x36f6);
        - delay: 3s
        - repeat:
            count: 3
            then:
              - component.update: scd41_sensor
              - delay: 6s
        - deep_sleep.enter: deep_sleep_id   # failsafe: SCD41 never published (I2C fail) -> still sleep, retry next wake

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino
  cpu_frequency: 80MHZ

logger:
  level: NONE   # production: no log output; DEBUG only while developing (logging costs CPU + UART power)

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true   # reconnect to last-known AP without a full scan
  power_save_mode: LIGHT   # modem sleeps while idle (during SCD41 single-shots); ~5x lower idle RX current
  output_power: 8.5dB      # cut TX peak current; raise toward 20dB only if range is marginal
  on_connect:
    then:
      - lambda: 'ESP_LOGI("boot", "wifi connected");'

mqtt:
  id: mqtt_client
  broker: 192.168.178.47
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true       # discovery_prefix defaults to "homeassistant" (matches HA)
  birth_message:        # empty = disabled; deep-sleep must not read as unavailable
  will_message:         # empty = disabled; no LWT offline while sleeping
  shutdown_message:     # empty = disabled; clean disconnect must not clear availability
  on_connect:
    then:
      - lambda: 'ESP_LOGI("boot", "mqtt connected");'

i2c:
  sda: GPIO1
  scl: GPIO21   # was GPIO3; freed GPIO3 (ADC1_CH3) for the battery sense line
  scan: false   # no boot-time bus probe: saves a few transactions + delay
  sda_pullup_enabled: false   # breakout 10k pulls to SCD41 VDD rail; internal pulls would back-power the sensor while the rail is off
  scl_pullup_enabled: false

spi:
  clk_pin: GPIO4
  mosi_pin: GPIO6

font:
  - file: "gfonts://Roboto"
    id: font_label
    size: 16
  - file: "gfonts://Roboto"
    id: font_co2
    size: 44
  - file: "gfonts://Roboto"
    id: font_temp
    size: 44
  - file: "gfonts://Roboto"
    id: font_humid
    size: 44

  - file: "gfonts://Material+Icons"
    id: font_icons
    size: 28
    glyphs:
      - "\U0000e7b0"  # co2
      - "\U0000e1ff"  # device_thermostat (thermometer)
      - "\U0000e798"  # water_drop
  - file: "gfonts://Material+Icons"
    id: font_status
    size: 16
    glyphs:
      - "\U0000e5ca"  # check — connected
      - "\U0000e1a4"  # battery_full
      - "\U0000e19c"  # battery_alert
      - "\U0000ebdd"  # battery_3_bar — half

globals:
  - id: boot_shown
    type: uint8_t
    initial_value: '0'
    restore_value: false

sensor:
  - platform: scd4x
    id: scd41_sensor
    address: 0x62
    update_interval: never
    automatic_self_calibration: true
    altitude_compensation: 500MAMSL
    temperature_offset: 1°C
    measurement_mode: single_shot
    co2:
      id: co2_value
      name: "${friendly_name} CO2"
      filters:
        - sliding_window_moving_average:
            window_size: 3
            send_every: 3
            send_first_at: 3
    temperature:
      id: temperature_value
      name: "${friendly_name} Temperature"
      filters:
        - sliding_window_moving_average:
            window_size: 3
            send_every: 3
            send_first_at: 3
    humidity:
      id: humidity_value
      name: "${friendly_name} Humidity"
      filters:
        - sliding_window_moving_average:
            window_size: 3
            send_every: 3
            send_first_at: 3
      on_value:
        then:
          - lambda: |-
              ESP_LOGI("mqtt_tx", "mqtt co2=%.0f ppm temp=%.2f C hum=%.2f %% (auto-published to ${device_name}/sensor/.../state)",
                id(co2_value).state, id(temperature_value).state, x);
          - lambda: |-
              // Battery was averaged at boot (before MQTT connected); re-publish the averaged
              // level now that the broker is up. battery_percent has no filter, so publish_state
              // goes straight to the MQTT callback. (battery_voltage is republished by the MQTT
              // resend-on-connect path, which bypasses the sensor filter.)
              if (!isnan(id(battery_percent).state))
                id(battery_percent).publish_state(id(battery_percent).state);
          - lambda: |-
              // SCD41 -> sleep (power_down, 0x36e0); ~0.8 uA until next wake_up.
              id(scd41_sensor)->write_command((uint16_t) 0x36e0);
          - display.page.show: page_normal
          - component.update: epaper_display   # single render (persists); update() blocks on BUSY
          - lambda: |-
              float wake_s = millis() / 1000.0f;
              ESP_LOGI("wake", "wake duration %.1f s", wake_s);
              id(wake_duration).publish_state(wake_s);
          - delay: 500ms
          - switch.turn_off: peripheral_power
          - deep_sleep.enter: deep_sleep_id
  - platform: template
    id: wake_duration
    name: "${friendly_name} Wake Duration"
    unit_of_measurement: "s"
    accuracy_decimals: 1
    device_class: duration
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
  - platform: adc
    id: battery_voltage
    pin: GPIO3
    attenuation: 12db
    update_interval: never
    name: "${friendly_name} Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 2.0   # battery-management board presents VBAT/2; scale back to cell volts
      - sliding_window_moving_average:
          window_size: 3
          send_every: 3
          send_first_at: 3
    on_value:
      then:
        - lambda: |-
            // Li-ion OCV -> SoC, piecewise-linear (resting cell voltage). Linear 3.6-4.2 V was wrong:
            // a Li-ion rests at ~82 % at 4.0 V and ~43 % at 3.8 V, not 67 % / 33 %.
            static const float V_TBL[] = {3.00f, 3.55f, 3.68f, 3.74f, 3.77f, 3.79f, 3.82f, 3.87f, 3.92f, 3.98f, 4.06f, 4.20f};
            static const float P_TBL[] = {0.0f,  5.0f, 10.0f, 20.0f, 30.0f, 40.0f, 50.0f, 60.0f, 70.0f, 80.0f, 90.0f, 100.0f};
            const int N = (int) (sizeof(V_TBL) / sizeof(V_TBL[0]));
            float v = x;
            float pct = 0.0f;
            if (v <= V_TBL[0]) {
              pct = 0.0f;
            } else if (v >= V_TBL[N - 1]) {
              pct = 100.0f;
            } else {
              for (int i = 0; i < N - 1; i++) {
                if (v >= V_TBL[i] && v <= V_TBL[i + 1]) {
                  float t = (v - V_TBL[i]) / (V_TBL[i + 1] - V_TBL[i]);
                  pct = P_TBL[i] + t * (P_TBL[i + 1] - P_TBL[i]);
                  break;
                }
              }
            }
            id(battery_percent).publish_state(pct);
            ESP_LOGI("battery", "cell %.3f V -> %.1f %%", v, pct);
  - platform: template
    id: battery_percent
    name: "${friendly_name} Battery"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

switch:
  - platform: gpio
    id: peripheral_power
    name: "Peripheral Power"
    pin: GPIO20
    restore_mode: ALWAYS_ON   # HIGH at setup (HARDWARE 800) -> SCD41 + EPD rail up before display init (PROCESSOR 400)
    internal: true            # firmware-managed power gate, not an HA entity

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 1.54inv2           # SSD1681 (WeAct 1.54" B/W); NOT 1.54in (GDEP015OC1) - wrong init leaves BUSY stuck -> setup timeout, blank screen
    cs_pin: GPIO7
    dc_pin: GPIO5
    reset_pin: GPIO0
    busy_pin: GPIO10
    reset_duration: 2ms       # required for newer driver HATs (Rev 2.1); otherwise reset pulse too long, panel never leaves busy
    rotation: "90"
    update_interval: never
    full_update_every: 1   # every refresh is full: partial updates ghost, and the pre-sleep image persists for the whole sleep
    pages:
      - id: page_boot
        lambda: |-
          ESP_LOGI("screen", "boot wifi=%d mqtt=%d", id(wifi_component).is_connected(), id(mqtt_client).is_connected());
          it.printf(0, 0, id(font_label), "${floor_label}");
          {
            float bp = id(battery_percent).state;
            it.print(200, 8, id(font_status), TextAlign::CENTER_RIGHT, (isnan(bp) || bp > 65.0f) ? "\ue1a4" : (bp >= 35.0f ? "\uebdd" : "\ue19c"));
            if (isnan(bp)) {
              it.print(176, 8, id(font_label), TextAlign::CENTER_RIGHT, "-- %");
            } else {
              it.printf(176, 8, id(font_label), TextAlign::CENTER_RIGHT, "%.0f %%", bp);
            }
          }
          it.line(0, 20, 200, 20);
          it.print(0, 30, id(font_label), "BOOTING...");
          it.print(0, 70, id(font_label), "WIFI...");
          if (id(wifi_component).is_connected()) {
            it.print(200, 70, id(font_status), TextAlign::CENTER_RIGHT, "\ue5ca");
          }
          it.print(0, 100, id(font_label), "MQTT...");
          if (id(mqtt_client).is_connected()) {
            it.print(200, 100, id(font_status), TextAlign::CENTER_RIGHT, "\ue5ca");
          }
          it.print(0, 130, id(font_label), "SENSOR...");
          // SENSOR check omitted: single-shot results arrive later; page flips to normal on first reading.
      - id: page_normal
        lambda: |-
          ESP_LOGI("screen", "screen co2=%.0f ppm temp=%.2f C hum=%.2f %%", id(co2_value).state, id(temperature_value).state, id(humidity_value).state);
          it.printf(0, 0, id(font_label), "${floor_label}");
          {
            float bp = id(battery_percent).state;
            it.print(200, 8, id(font_status), TextAlign::CENTER_RIGHT, (isnan(bp) || bp > 65.0f) ? "\ue1a4" : (bp >= 35.0f ? "\uebdd" : "\ue19c"));
            if (isnan(bp)) {
              it.print(176, 8, id(font_label), TextAlign::CENTER_RIGHT, "-- %");
            } else {
              it.printf(176, 8, id(font_label), TextAlign::CENTER_RIGHT, "%.0f %%", bp);
            }
          }
          it.line(0, 20, 200, 20);
          it.print(0, 50, id(font_icons), TextAlign::CENTER_LEFT, "\ue7b0");  // co2
          if (isnan(id(co2_value).state)) {
            it.print(200, 50, id(font_co2), TextAlign::CENTER_RIGHT, "--");
          } else {
            it.printf(200, 50, id(font_co2), TextAlign::CENTER_RIGHT, "%.0f", id(co2_value).state);
          }
          it.line(0, 80, 200, 80);
          it.print(0, 110, id(font_icons), TextAlign::CENTER_LEFT, "\ue1ff");  // thermometer
          if (isnan(id(temperature_value).state)) {
            it.print(200, 110, id(font_temp), TextAlign::CENTER_RIGHT, "-- C");
          } else {
            it.printf(200, 110, id(font_temp), TextAlign::CENTER_RIGHT, "%.1f C", id(temperature_value).state);
          }
          it.line(0, 140, 200, 140);
          it.print(0, 170, id(font_icons), TextAlign::CENTER_LEFT, "\ue798");  // water drop
          if (isnan(id(humidity_value).state)) {
            it.print(200, 170, id(font_humid), TextAlign::CENTER_RIGHT, "-- %%");
          } else {
            it.printf(200, 170, id(font_humid), TextAlign::CENTER_RIGHT, "%.0f %%", id(humidity_value).state);
          }

deep_sleep:
  id: deep_sleep_id
  sleep_duration: 5min
  run_duration: 60s   # failsafe: measurement + render ≈ 30 s; guarantees sleep even if wifi/mqtt/sensor hangs

interval:
  - interval: 1s
    then:
      - if:
          condition:
            display.is_displaying_page: page_boot
          then:
            - lambda: |-
                // Main-loop poll: re-render the boot page when wifi/mqtt state changes.
                // (mqtt.on_connect runs on the network task — unsafe to render from there.)
                uint8_t now = (id(wifi_component).is_connected() ? 1 : 0)
                            | (id(mqtt_client).is_connected() ? 2 : 0);
                if (now != id(boot_shown)) {
                  id(boot_shown) = now;
                  id(epaper_display).update();
                }
