substitutions:
  light_sleep_enabled: "true"   # per-build debug override: esphome run X-ble.yaml -s light_sleep_enabled=false

# BLE transport: BTHome v2 advertisements picked up by HA's BTHome
# integration. No wifi/mqtt/time here — the node wakes, measures, advertises
# for `duration`, renders the e-paper, and deep-sleeps with WiFi off.
# The BLE advertisement name is copied from the runtime `room_label` text input
# on every wake. The BTHome encoder trims over-long names to fit the 31-byte
# payload, so a 16-char room label is safe (≈9 chars remain visible).

# WiFi exists only for setup and the cold-boot config window (co2-node-setup.yaml);
# timer wakes never enable it — the rail stays cold and BLE carries the data.
wifi:
  enable_on_boot: false

external_components:
  - source:
      type: local
      path: components
    components: [runtime_epaper, scd4x, bthome_adv, captive_portal]

esp32_ble:
  id: ble_hub
  enable_on_boot: false
  disable_bt_logs: true
  max_connections: 1

bthome_adv:
  id: bthome
  ble_id: ble_hub
  name: "CO2"
  co2: co2_value
  temperature: temperature_value
  humidity: humidity_value
  battery: battery_percent
  duration: 700ms
  interval: 100ms
  tx_power: 0dBm

esphome:
  on_boot:
    - priority: 790   # after the switch + restoring globals (HARDWARE 800), before base's
      then:           # 750/100 readers of allow_light_sleep.
        - lambda: |-
            // Cold boots run the WiFi config window (CPU awake anyway); light sleep is
            // only meaningful on timer wakes.
            id(allow_light_sleep) = ${light_sleep_enabled} && !id(cold_boot);

script:
  - id: !extend transport_publish
    then:
      - lambda: 'id(bthome)->set_name(id(room_label).state);'
      - ble.enable:
      - lambda: 'id(bthome).publish();'

interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (id(bthome).is_done() || millis() > 25000) {
            id(transport_ready) = true;
          }
