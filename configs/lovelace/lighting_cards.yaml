# Scenes
- type: "button"
  entity: scene.movie_night
  name: "Movie Night"
  icon: "mdi:movie"
  tap_action:
    action: "call-service"
    service: "scene.turn_on"
    target:
      entity_id: scene.movie_night

- type: "button"
  entity: scene.good_morning
  name: "Good Morning"
  icon: "mdi:weather-sunny"
  tap_action:
    action: "call-service"
    service: "scene.turn_on"
    target:
      entity_id: scene.good_morning

- type: "button"
  entity: scene.good_night
  name: "Good Night"
  icon: "mdi:weather-night"
  tap_action:
    action: "call-service"
    service: "scene.turn_on"
    target:
      entity_id: scene.good_night

- type: "button"
  entity: scene.all_off
  name: "All Off"
  icon: "mdi:power"
  tap_action:
    action: "call-service"
    service: "scene.turn_on"
    target:
      entity_id: scene.all_off