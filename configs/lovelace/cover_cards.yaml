# Cover Cards for Lovelace
# File: configs/lovelace/cover_cards.yaml

# Top Floor Covers (Velux + Somfy)
- type: "cover"
  entity: cover.top_floor_bedroom_blind_left
  name: "Bedroom Blind Left"
  icon: "mdi:blinds"

- type: "cover"
  entity: cover.top_floor_bedroom_blind_right
  name: "Bedroom Blind Right"
  icon: "mdi:blinds"

- type: "cover"
  entity: cover.top_floor_velux_bedroom
  name: "Bedroom Velux"
  icon: "mdi:window-open-variant"

- type: "cover"
  entity: cover.top_floor_velux_bathroom
  name: "Bathroom Velux"
  icon: "mdi:window-open-variant"

- type: "cover"
  entity: cover.top_floor_skylight_blind
  name: "Skylight Blind"
  icon: "mdi:blinds"

# Mid Floor Covers
- type: "cover"
  entity: cover.mid_floor_living_room_blind
  name: "Living Room Blind"
  icon: "mdi:blinds"

- type: "cover"
  entity: cover.mid_floor_kitchen_blind
  name: "Kitchen Blind"
  icon: "mdi:blinds"

- type: "cover"
  entity: cover.mid_floor_velux_living
  name: "Living Velux"
  icon: "mdi:window-open-variant"

- type: "cover"
  entity: cover.mid_floor_velux_kitchen
  name: "Kitchen Velux"
  icon: "mdi:window-open-variant"

# Bottom Floor Covers
- type: "cover"
  entity: cover.bottom_floor_office_blind
  name: "Office Blind"
  icon: "mdi:blinds"

- type: "cover"
  entity: cover.bottom_floor_gym_blind
  name: "Gym Blind"
  icon: "mdi:blinds"

- type: "cover"
  entity: cover.bottom_floor_velux_utility
  name: "Utility Velux"
  icon: "mdi:window-open-variant"

# Group controls
- type: "entities"
  title: "All Blinds"
  entities:
    - entity: cover.top_floor_bedroom_blind_left
    - entity: cover.top_floor_bedroom_blind_right
    - entity: cover.top_floor_skylight_blind
    - entity: cover.mid_floor_living_room_blind
    - entity: cover.mid_floor_kitchen_blind
    - entity: cover.bottom_floor_office_blind
    - entity: cover.bottom_floor_gym_blind

- type: "entities"
  title: "All Velux Windows"
  entities:
    - entity: cover.top_floor_velux_bedroom
    - entity: cover.top_floor_velux_bathroom
    - entity: cover.mid_floor_velux_living
    - entity: cover.mid_floor_velux_kitchen
    - entity: cover.bottom_floor_velux_utility

# Scene buttons for covers
- type: "button"
  entity: scene.all_blinds_open
  name: "All Blinds Open"
  icon: "mdi:blinds-open"
  tap_action:
    action: "call-service"
    service: "scene.turn_on"
    target:
      entity_id: scene.all_blinds_open

- type: "button"
  entity: scene.all_blinds_closed
  name: "All Blinds Closed"
  icon: "mdi:blinds"
  tap_action:
    action: "call-service"
    service: "scene.turn_on"
    target:
      entity_id: scene.all_blinds_closed

- type: "button"
  entity: scene.all_velux_open
  name: "All Velux Open"
  icon: "mdi:window-open"
  tap_action:
    action: "call-service"
    service: "scene.turn_on"
    target:
      entity_id: scene.all_velux_open

- type: "button"
  entity: scene.all_velux_closed
  name: "All Velux Closed"
  icon: "mdi:window-closed"
  tap_action:
    action: "call-service"
    service: "scene.turn_on"
    target:
      entity_id: scene.all_velux_closed