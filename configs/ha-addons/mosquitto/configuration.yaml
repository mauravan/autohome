# Mosquitto MQTT Broker Add-on Configuration
# File: configs/ha-addons/mosquitto/configuration.yaml

# Authentication logins (must match secrets.yaml)
logins:
  - username: "!secret mqtt_username"
    password: "!secret mqtt_password"

# MQTT settings
mqtt:
  anonymous: false
  customize:
    active: true
    folder: "mosquitto"

# Certificates for TLS (optional, for external access)
certfile: fullchain.pem
keyfile: privkey.pem
require_certificate: false

# Logging
log_type:
  - error
  - warning
  - notice
  - information

# MQTT listeners
max_queued_messages: 1000
max_inflight_messages: 100
message_size_limit: 1048576
persistent_client_expiration: 7d

# Listeners
listeners:
  - port: 1883
    allow_anonymous: false
  - port: 8883
    allow_anonymous: false
    protocol: mqtt
  - port: 8083
    protocol: websockets
    allow_anonymous: false

# Persistence
persistence: true
persistence_location: /data/mosquitto/

# Bridge configuration (if bridging to another broker)
# bridges: []

# Sys interval (for $SYS topics)
sys_interval: 10

# Maximum packet size
max_packet_size: 268435456